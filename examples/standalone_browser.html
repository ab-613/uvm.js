<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVM Standalone Script Example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    pre { background: #18181b; color: #4ade80; padding: 16px; border-radius: 8px; overflow-x: auto; }
    textarea { width: 100%; height: 120px; font-family: monospace; padding: 10px; font-size: 14px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
  </style>
  <!-- 1. Load UVM directly via standard script tag (No bundler, No importmap!) -->
  <script src="../dist/uvm.min.js"></script>
</head>
<body>
  <h2>UVM Standalone &lt;script src&gt; Demo</h2>
  <p>Run Python directly in your browser with zero WebAssembly download (under 250 KB).</p>

  <textarea id="code">
def fib(n):
    return n if n <= 1 else fib(n - 1) + fib(n - 2)

for i in range(8):
    print(f"fib({i}) = {fib(i)}")
</textarea>
  <br>
  <button id="runBtn">Run Python Code</button>

  <h3>Output:</h3>
  <pre id="output">Click 'Run Python Code'...</pre>

  <script>
    // 2. Instantiate and run directly from window.UniversalInterpreter
    const uvm = new UniversalInterpreter();

    document.getElementById('runBtn').addEventListener('click', async () => {
      const code = document.getElementById('code').value;
      const outElem = document.getElementById('output');
      outElem.textContent = 'Executing...';

      try {
        const result = await uvm.run(code, { language: 'python' });
        outElem.textContent = result.output || '(No stdout)';
      } catch (err) {
        outElem.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
